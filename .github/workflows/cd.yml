# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CD

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, logger]

    env:
      ES_HOST: ${{ secrets.ES_HOST }}
      ES_PORT: ${{ secrets.ES_PORT }}
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
      ES_PASSWORD: ${{ secrets.ES_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - name: Print working directory
        run: |
          pwd
          ls -la
          git status

      - name: Create .env file from GitHub Secrets
        run: |
          echo "ES_HOST=${{ secrets.ES_HOST }}" >> .env
          echo "ES_PORT=${{ secrets.ES_PORT }}" >> .env
          echo "ES_USERNAME=${{ secrets.ES_USERNAME }}" >> .env
          echo "ES_PASSWORD=${{ secrets.ES_PASSWORD }}" >> .env
          echo "USER_SERVICE_URL=${{ secrets.USER_SERVICE_URL }}" >> .env
          echo "LOG_ENVIRONMENT=production" >> .env
          echo "FLAG_FAILED_LOGIN_COUNT=${{ vars.FLAG_FAILED_LOGIN_COUNT || '5' }}" >> .env
          echo "FLAG_FAILED_LOGIN_WINDOW_MIN=${{ vars.FLAG_FAILED_LOGIN_WINDOW_MIN || '10' }}" >> .env
          echo "FLAG_BULK_DELETE_COUNT=${{ vars.FLAG_BULK_DELETE_COUNT || '10' }}" >> .env
          echo "FLAG_BULK_DELETE_WINDOW_MIN=${{ vars.FLAG_BULK_DELETE_WINDOW_MIN || '10' }}" >> .env
          echo "FLAG_OFF_HOURS_START=${{ vars.FLAG_OFF_HOURS_START || '22:00' }}" >> .env
          echo "FLAG_OFF_HOURS_END=${{ vars.FLAG_OFF_HOURS_END || '07:00' }}" >> .env
          echo "FLAG_MASS_ACCESS_COUNT=${{ vars.FLAG_MASS_ACCESS_COUNT || '30' }}" >> .env
          echo "FLAG_MASS_ACCESS_WINDOW_MIN=${{ vars.FLAG_MASS_ACCESS_WINDOW_MIN || '10' }}" >> .env
          echo "FLAG_SENSITIVE_FIELDS=${{ vars.FLAG_SENSITIVE_FIELDS || 'nric,NRIC,dateOfBirth,DOB,dob' }}" >> .env
          echo "FLAG_ERROR_SPIKE_COUNT=${{ vars.FLAG_ERROR_SPIKE_COUNT || '20' }}" >> .env
          echo "FLAG_ERROR_SPIKE_WINDOW_MIN=${{ vars.FLAG_ERROR_SPIKE_WINDOW_MIN || '5' }}" >> .env

      - name: Delete old deployment
        run: |
          echo "Deleting old deployment..."
          kubectl delete deployment.apps/logger-service-dev service/logger-service-dev --ignore-not-found=true -n default

      - name: Delete old docker images
        run: |
          docker rmi logger_service_dev || true
          docker rmi localhost:5000/logger_service_dev || true

      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build --no-cache -f Dockerfile -t logger_service_dev .

      - name: Tag Docker image
        run: |
          echo "Tagging Docker image..."
          docker tag logger_service_dev:latest localhost:5000/logger_service_dev:latest

      - name: Push Docker image to local registry
        run: |
          echo "Pushing Docker image to localhost:5000...."
          docker push localhost:5000/logger_service_dev:latest

      - name: Deploying to Kubernetes
        run: |
          echo "Deploying..."
          kubectl apply -n default -f './k8s/deployment-prod.yaml'
