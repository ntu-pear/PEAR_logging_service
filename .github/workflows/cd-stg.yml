# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CD

on:
  push:
    branches: ["staging"]

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, logger_staging]

    steps:
      - uses: actions/checkout@v4
      - name: Print working directory
        run: |
          pwd
          ls -la
          git status

      - name: Create .env file from GitHub Secrets
        run: |
          echo "ES_HOST=${{ secrets.ES_HOST_STAGING }}" >> .env
          echo "ES_PORT=${{ secrets.ES_PORT }}" >> .env
          echo "ES_USERNAME=${{ secrets.ES_USERNAME }}" >> .env
          echo "ES_PASSWORD=${{ secrets.ES_PASSWORD_STAGING }}" >> .env
          echo "USER_SERVICE_URL=${{ secrets.USER_SERVICE_URL_STAGING }}" >> .env
          echo "LOG_ENVIRONMENT=staging" >> .env
          echo "FLAG_FAILED_LOGIN_COUNT=${{ vars.FLAG_FAILED_LOGIN_COUNT || '5' }}" >> .env
          echo "FLAG_FAILED_LOGIN_WINDOW_MIN=${{ vars.FLAG_FAILED_LOGIN_WINDOW_MIN || '10' }}" >> .env
          echo "FLAG_BULK_DELETE_COUNT=${{ vars.FLAG_BULK_DELETE_COUNT || '10' }}" >> .env
          echo "FLAG_BULK_DELETE_WINDOW_MIN=${{ vars.FLAG_BULK_DELETE_WINDOW_MIN || '10' }}" >> .env
          echo "FLAG_OFF_HOURS_START=${{ vars.FLAG_OFF_HOURS_START || '22:00' }}" >> .env
          echo "FLAG_OFF_HOURS_END=${{ vars.FLAG_OFF_HOURS_END || '07:00' }}" >> .env
          echo "FLAG_MASS_ACCESS_COUNT=${{ vars.FLAG_MASS_ACCESS_COUNT || '30' }}" >> .env
          echo "FLAG_MASS_ACCESS_WINDOW_MIN=${{ vars.FLAG_MASS_ACCESS_WINDOW_MIN || '10' }}" >> .env
          echo "FLAG_SENSITIVE_FIELDS=${{ vars.FLAG_SENSITIVE_FIELDS || 'nric,NRIC,dateOfBirth,DOB,dob' }}" >> .env
          echo "FLAG_ERROR_SPIKE_COUNT=${{ vars.FLAG_ERROR_SPIKE_COUNT || '20' }}" >> .env
          echo "FLAG_ERROR_SPIKE_WINDOW_MIN=${{ vars.FLAG_ERROR_SPIKE_WINDOW_MIN || '5' }}" >> .env
          chmod 600 .env

      - name: Stop existing staging container (if running)
        run: |
          docker compose down || true

      - name: Build and start staging container
        run: |
          docker compose up -d --build

      - name: Prune old images
        run: |
          docker image prune -f

      - name: Verify container is running
        run: |
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors \
            http://localhost:30002/ > /dev/null \
            || { docker compose ps --all; docker compose logs --tail=100; exit 1; }
