<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PEAR Logger Service — Staging Demo</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #f5f5f5; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 2rem; }
    table { border-collapse: collapse; width: 100%; background: white; }
    th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; font-size: 0.85rem; }
    th { background: #333; color: white; }
    tr:nth-child(even) { background: #fafafa; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>PEAR Logger Service — Staging</h1>

  <h2>Patient Logs</h2>
  <table id="patient-table">
    <thead>
      <tr><th>Timestamp</th><th>Table</th><th>Method</th><th>User</th><th>Message</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Activity Logs</h2>
  <table id="activity-table">
    <thead>
      <tr><th>Timestamp</th><th>Table</th><th>Method</th><th>User</th><th>Message</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadLogs(endpoint, tableId) {
      const tbody = document.querySelector(`#${tableId} tbody`);
      try {
        const res = await fetch(`${endpoint}?pageSize=10`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        tbody.innerHTML = "";
        json.data.forEach(row => {
          const tr = document.createElement("tr");
          ["timestamp", "table", "method", "user", "message"].forEach(key => {
            const td = document.createElement("td");
            td.textContent = row[key] ?? "";
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = "";
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 5;
        td.className = "error";
        td.textContent = `Failed to load: ${err.message}`;
        tr.appendChild(td);
        tbody.appendChild(tr);
      }
    }

    loadLogs("/api/Logs/Patient", "patient-table");
    loadLogs("/api/Logs/Activity", "activity-table");
  </script>
</body>
</html>
